[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euro-sdt"
version = "0.1.0"
description = "EU institutional elite research pipeline — scrape, extract, verify, render"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Gavin Mendel-Gleason", email = "gavin@scidonia.ai"},
    {name = "Donagh Davis"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "pypdf>=5.0",
    "rich>=13.0",
    "playwright>=1.50",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8"]
all = ["euro-sdt[nlp]"]

[project.scripts]
euro-sdt = "euro_sdt.cli:app"
euro-sdt-wiki = "euro_sdt.render.wiki:main"
euro-sdt-scrape = "euro_sdt.cli:scrape_group"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/euro_sdt"]
