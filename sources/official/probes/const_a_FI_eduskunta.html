rengthening of democratic institutions, the maintenance of the international rules-based order, and the adherence to international law.","The Parliament’s most important task is to enact laws. It also decides on the state budget, elects the Prime Minister, and oversees the Government.  In addition, Parliament approves Finland’s international agreements and plays a role in European Union affairs.\n","​​There are many ways for you to explore the Parliament Building and learn about the activities of the Parliament. Come observe a plenary session or book a visit.","The Speaker of Parliament holds a central role in the functioning of Parliament. This position is also reflected in the informal national hierarchy, where the Speaker ranks immediately after the President of the Republic. The Speaker presides over plenary sessions and ensures their compliance with the Constitution.\n","/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/mps-remunerations-and-fixed-reimbursements-of-expenses/","The 78th Session of the Nordic Council brought together Nordic parliamentarians, prime ministers, heads of government and ministers from various sectors in Helsinki on 26-29 October. The session week focused on strengthening Nordic comprehensive security, enhancing preparedness, and deepening co-operation in foreign, security and defence policy.","Pohjoismaiden neuvoston istuntosali, jossa puhemiehistö istuu puisen puhujakorokkeen takana. Taustalla näkyvät Pohjoismaiden liput.","/api/assets/globalassets/kuvat/sisaltosivujen-kuvat/korttilohkojen-kuvat/eduskuntatalo-syksylla-2025.jpg?timestamp=639221375690000000","Parliament of Finland has two hundred members, elected for a term of four years. Members are organised into parliamentary groups, of which there are currently eleven.","/api/assets/globalassets/kuvat/sisaltosivujen-kuvat/korttilohkojen-kuvat/tutustu-valiokuntiin-2025.jpg?timestamp=639221307680000000","Neuvottelutila, jossa suuri joukko osallistujia istuu suuren pyöreän pöydän ympärillä. Pöydällä on kannettavia tietokoneita, asiakirjoja ja mikrofoneja. Taustalla näkyy puupaneloitu seinä ja katossa valaisinryhmä.","Parliament plays a strong role in decision-making on EU matters. Parliament decides what position Finland should take in EU decision-making on matters that fall within Parliament's competence.​","/api/assets/globalassets/kuvat/sisaltosivujen-kuvat/korttilohkojen-kuvat/vieraile-eduskunnassa-2025.jpg?timestamp=639221319070000000","You can visit the Parliament Building by booking a free guided tour. All plenary sessions are open for public to view from the gallery.","Kaksi henkilöä tervehtii toisiaan kättelemällä käytävämaisessa vastaanottotilassa. Tilassa on useita muita osallistujia, istuimia sekä suuri värikäs seinätekstiili tai taideteos taustalla.","/api/assets/globalassets/kuvat/sisaltosivujen-kuvat/korttilohkojen-kuvat/international-activities-2025.jpg?timestamp=639222005000000000","The Library of Parliament serves as the central library providing materials on Parliament, law and social and political sciences and as the central archive for the Parliament of Finland. The collections, services and expertise of the Library of Parliament are available for everyone.","Parliament provides open data on Members of Parliament and parliamentary matters for everyone to use. You can search, view, and download information, for example, for research purposes. Open data is easiest to use when browsing search results. You can also download open data via the API.","The Parliament of Finland is one of the most open in the world. Parliament strives to serve the media actively and to create good working conditions for the media. However, foreign journalists are subject to general rules concerning visitors and are accompanied at all times.","Eduskunnan puhemiehistö eduskunnan Valtiosalissa kuvattuna.  Puhemies Jussi Halla-aho, ensimmäinen varapuhemies Paula Risikko ja toinen varapuhemies Tarja Filatov. ","The Finnish Parliament has two hundred Members of Parliament, who are elected in elections every four years. The Members of Parliament work in plenary sessions, in committees, and in parliamentary groups.","A Member of Parliament is a legislator, a societal actor, a representative of their constituency and an international actor. Plenary sessions are the most visible part of an MP’s parliamentary work, but committees provide MPs with their most important channel for influencing decision-making.","MPs do not receive a salary, instead, they are paid the Member of Parliament’s remuneration. The remuneration is taxable income. In addition to the remuneration, MPs receive a tax‑free fixed reimbursement of expenses to cover their costs. ","A Member of Parliament must submit to Parliament a declaration of private interests, income that may affect the MP's ability to carry out responsibilities in Parliament and gifts received by the MP.","An MP may be replaced during the electoral term if Parliament grants the Member a release from the office of Member of Parliament. An MP may also suspend the performance of parliamentary duties if they are elected as a Member of the European Parliament during the electoral term.\n\n","A Member of Parliament accrues pension entitlements. As a rule, an MP may receive a pension at the age of 65. An MP may also be entitled to a fixed-term adjustment allowance.","The Social Affairs and Health Committee deals with matters concerning social welfare and health care, social security and environmental health care.​","Parliament’s decisions are prepared in committees. ​Parliament has 16 permanent special committees and the Grand Committee, which deals primarily with EU affairs.","Members form parliamentary groups according to political party, and these play a key role in parliamentary work on a practical level. Each parliamentary group elects its own chairpersons and possibly other organs.","Members of Parliament also represent Finland in international politics. They work within inter-parliamentary organisations, and there are bilateral exchange visits between parliaments. An important part of this cooperation also includes meetings and conferences of the Speakers as well as the activities of friendship groups.","Parliament regurarly participates in the activities of nine interparliamentary organisations. Delegations are appointed for the periods of an electoral term.","Parliament participates in interparliamentary cooperation within the European Union as part of the interaction between the Member States and the European Parliament. The handling of EU affairs involves coordination, cooperation among Members of Parliament, and international contacts, which are carried out both through Parliament’s internal operations and via interparliamentary networks.","In addition to the official international activities of Parliament, international contacts are maintained by friendship groups established by MPs. The friendship groups listed below have been organized after the spring 2023 parliamentary elections. ​​The activities of the friendship groups are informal.​","Members of Parliament participate in various societal networks, friendship groups, and clubs. These bring together MPs with shared interests and complement the debates held in Parliament.","The Parliament of Finland has two hundred members, elected by citizens through general elections. Within Parliament, Members are organised into parliamentary groups, which are divided into government and opposition groups. Parliament also appoints Members to serve in institutions and bodies operating at both national and international levels.","On this page, you can view the matters currently under consideration in Parliament. You can filter the matters by the functions of Parliament, by type of matter, or by the different stages of consideration. Note that parliamentary documents are only available in Finnish and Swedish.","The Parliament decides on how Finland positions itself on those matters to be decided in the EU that fall within its competence.","EU regulations, and in particular directives, often require amendments to Finland’s national legislation. Such matters are decided in Parliament through the ordinary legislative procedure. EU matters are dealt with in all committees, but the Grand Committee acts as Parliament’s main EU committee and adopts Parliament’s position on European Union matters.","The Parliament of Finland plays a strong role in decision-making on EU matters, compared with many other member states. Parliament decides what position Finland should take in EU decision-making on matters that fall within Parliament's competence.","On this page, you can find the latest voting results from plenary sessions. In Parliament, votes are most commonly held during the consideration of legislative proposals and the state budget, as well as in elections of persons and bodies. Note that voting results are only available in Finnish and Swedish.","In Parliament, votes are most commonly held in the consideration of bills and the State budget, as well as in elections of officials and parliamentary bodies. In a vote, the option with the most support among two or more alternatives is chosen. ","Parliament can enact legislation on the basis of a government proposal, a Member's motion or a citizens' initiative. Most legislation is based on government proposals, which average about 250 a year. ","Acts are enacted in a plenary session. Plenary sessions are held from Tuesday to Friday. On Tuesdays and Wednesdays, plenary sessions usually start at 2 p.m., on Thursdays at 4 p.m., and on Fridays at 1 p.m.","Parliament's most important task, enacting legislation, takes place in plenary session. Plenary sessions are open to the public, and you can also follow them online.","Approving the budget is the Parliament’s second core function alongside the enactment of laws. The annual budget sets out the central government income and expenditure for the following year. The Government submits a budget proposal to Parliament, and Parliament makes the final decision.","New legislation is enacted or existing laws amended based on a government proposal, a legislative motion by an MP, or a citizens’ initiative. The legislative process in Parliament begins with a referral debate, after which the bill is referred to a committee for consideration. Once the committee has completed its report, the bill is debated in two readings in a plenary session. If Parliament approves the bill, it issues a formal response. Finally, the President of the Republic confirms the law.\n","Parliament’s term of office is the electoral term, i.e. four years. The term begins once the results of the parliamentary elections have been confirmed and continues until the next elections have been held.","Over the course of its history, the Parliament of Finland has enacted laws under the shadow of imperial rule, revolution and world wars. Finnish representative democracy has withstood both internal and external pressures without breaking down—something rare in the violent history of 20th-century Europe.\n\n","The Parliamentary Office supports parliamentary work and the work of Members of Parliament. Approximately 400 officials and about 40 assistants to Members of Parliament work in the Parliamentary Office.","In parliamentary elections, 200 Members of Parliament are elected to the Parliament of Finland. Parliamentary elections are held every four years. The next parliamentary elections will be in 2027.","The brochures provide information on, among other things, the work of Parliament, the history of Parliament and the early years of independence, Parliament’s role in the national preparation of the matters to be deliberated in the European Union, the Parliament Building and the Library of Parliament.","Parliament supports democracy education as well as the teaching of social studies and history by providing learning materials for schools.","Parliament enacts legislation and approves the state budget. It also elects the Prime Minister and oversees the Government. In addition, Parliament ratifies international treaties and influences European Union matters. ","The Parliament Building can be explored independently either through a virtual tour or by coming on site to follow a plenary session from the public gallery. The events at Visitor Centre are also open to the public.","The plenary session of Parliament decided on the construction of the Parliament Building in March 1925. Construction of the building, designed by architect J. S. Sirén, began on Arkadianmäki in 1926, and the building was completed in 1931.","In elections, we choose who makes the decisions. Through elections, we choose Parliament, the President, municipal and county decision-makers, and Finland’s representatives in the European Union. ","Parliament decides on the laws of Finland. Citizens can also propose the creation of a new law or amendments to existing legislation. You can also contact Members of Parliament (MPs) and share your views on legislative proposals. ","There are many ways to influence decisions. You can choose the way that best suits you. \n\nExamples include citizens’ initiatives, joining an organisation or a political party, engaging in discussions and taking part in different forms of expression. ","Everyone has the right to participate in politics and to influence what kinds of decisions are made. You can vote in elections and influence who makes the decisions. You can engage in discussions and express your views when decision-makers are preparing new legislation. In addition, there are many other ways to participate and make an impact. ","The Parliament Building is open to visitors. You can reserve a spot for a guided tour through the booking service. You can also follow the plenary sessions of Parliament, public hearings of committees, and other events organized by Parliament live online. Everyone can influence decision-making. You can discuss and share your opinions when new laws are being planned.")),(function(a,b,c,d,e){return {type:"data",data:{content:{contentLink:{id:6,workId:0,guidValue:"04e2e616-dbdc-4e43-9c45-15a7357158df",providerName:null,url:"/en/",expanded:null},name:"Parliament of Finland - Start Page",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","StartPage"],parentLink:null,routeSegment:"eduskunta---frontpage",url:"/en/",changed:null,created:null,startPublish:"2025-08-14T09:40:23Z",stopPublish:null,saved:null,status:null,navigationTitle:"Parliament of Finland",heroTeaser:{id:14360,workId:0,guidValue:"783be84a-b5d9-4453-b31a-61521e9c67a4",providerName:null,url:"/en/press-releases/nordic-council-session-week-focused-on-nordic-comprehensive-security/",expanded:{contentLink:{id:14360,workId:0,guidValue:"783be84a-b5d9-4453-b31a-61521e9c67a4",providerName:null,url:"/en/press-releases/nordic-council-session-week-focused-on-nordic-comprehensive-security/",expanded:null},name:"Nordic Council Session week focused on Nordic comprehensive security",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","AnnouncementPage"],parentLink:null,routeSegment:"nordic-council-session-week-focused-on-nordic-comprehensive-security",url:"/en/press-releases/nordic-council-session-week-focused-on-nordic-comprehensive-security/",changed:null,created:null,startPublish:"2026-10-29T14:03:10Z",stopPublish:null,saved:null,status:null,teaserTitle:"Nordic Council Session week focused on Nordic comprehensive security",teaserText:"The 78th Session of the Nordic Council brought together Nordic parliamentarians, prime ministers, heads of government and ministers from various sectors in Helsinki on 26-29 October. The session week focused on strengthening Nordic comprehensive security, enhancing preparedness, and deepening co-operation in foreign, security and defence policy.",teaserLinkText:"Read more",teaserImage:{altText:"Pohjoismaiden neuvoston istuntosali, ment provides open data on Members of Parliament and parliamentary matters for everyone to use. You can search, view, and download information, for example, for research purposes. Open data is easiest to use when browsing search results. You can also download open data via the API.",teaserLinkText:"Read more",teaserImage:null}}},{href:"/en/for-the-media/",title:null,target:null,text:"For the media",contentLink:{id:87,workId:0,guidValue:"c0a24b1f-97f2-4c1e-8e2c-3a14ed949882",providerName:null,url:"/en/for-the-media/",expanded:{contentLink:{id:87,workId:0,guidValue:"c0a24b1f-97f2-4c1e-8e2c-3a14ed949882",providerName:null,url:"/en/for-the-media/",expanded:null},name:"For the media",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"for-the-media",url:"/en/for-the-media/",changed:null,created:null,startPublish:"2025-04-22T07:40:41Z",stopPublish:null,saved:null,status:null,teaserTitle:"For the media",teaserText:"The Parliament of Finland is one of the most open in the world. Parliament strives to serve the media actively and to create good working conditions for the media. However, foreign journalists are subject to general rules concerning visitors and are accompanied at all times.",teaserLinkText:"Read more",teaserImage:null}}}],footerShortcutLinks:[{href:"/en/parliament-and-its-activities/parliament-at-work/",title:null,target:null,text:"Parliament at work​",contentLink:{id:36,workId:0,guidValue:"affbb4c3-46d2-4c5a-aa05-52f9cbe118af",providerName:null,url:"/en/parliament-and-its-activities/parliament-at-work/",expanded:{contentLink:{id:36,workId:0,guidValue:"affbb4c3-46d2-4c5a-aa05-52f9cbe118af",providerName:null,url:"/en/parliament-and-its-activities/parliament-at-work/",expanded:null},name:"Parliament at work​",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"parliament-at-work",url:"/en/parliament-and-its-activities/parliament-at-work/",changed:null,created:null,startPublish:"2025-09-16T12:06:36Z",stopPublish:null,saved:null,status:null,teaserTitle:"Parliament at work​",teaserText:b,teaserLinkText:"Read more",teaserImage:null}}},{href:"/en/visit-and-participate/visit-parliament/",title:null,target:null,text:"Visit Parliament",contentLink:{id:51,workId:0,guidValue:"3483dee6-f13a-4226-979d-c73a4b3c2ab1",providerName:null,url:"/en/visit-and-participate/visit-parliament/",expanded:{contentLink:{id:51,workId:0,guidValue:"3483dee6-f13a-4226-979d-c73a4b3c2ab1",providerName:null,url:"/en/visit-and-participate/visit-parliament/",expanded:null},name:"Visit Parliament",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"visit-parliament",url:"/en/visit-and-participate/visit-parliament/",changed:null,created:null,startPublish:"2025-09-16T12:28:37Z",stopPublish:null,saved:null,status:null,teaserTitle:"Visit Parliament",teaserText:c,teaserLinkText:"Read more",teaserImage:null}}},{href:"/en/members-and-parliamentary-bodies/the-speaker/",title:null,target:null,text:"The Speaker",contentLink:{id:15,workId:0,guidValue:"029dcd22-6f19-4729-a147-a4d166fb9293",providerName:null,url:"/en/members-and-parliamentary-bodies/the-speaker/",expanded:{contentLink:{id:15,workId:0,guidValue:"029dcd22-6f19-4729-a147-a4d166fb9293",providerName:null,url:"/en/members-and-parliamentary-bodies/the-speaker/",expanded:null},name:"The Speaker",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"the-speaker",url:"/en/members-and-parliamentary-bodies/the-speaker/",changed:null,created:null,startPublish:"2025-08-21T05:48:33Z",stopPublish:null,saved:null,status:null,teaserTitle:"The Speaker",teaserText:d,teaserLinkText:"Read more",teaserImage:{altText:"Eduskunnan puhemiehistö eduskunnan Valtiosalissa kuvattuna.  Puhemies Jussi Halla-aho, ensimmäinen varapuhemies Paula Risikko ja toinen varapuhemies Tarja Filatov. ",id:179,workId:0,guidValue:"1990ca73-878f-4034-96ef-6d2541e14644",providerName:null,url:"/api/assets/globalassets/kuvat/sisaltosivujen-kuvat/puhemiehisto.jpg?timestamp=638949995650000000",expanded:null}}}}],footerSocialMediaLinks:[{href:"https://www.facebook.com/suomeneduskunta",title:"Facebook",target:"_blank",text:"Facebook",contentLink:null},{href:"https://www.flickr.com/photos/finnishparliament",title:"Flickr",target:"_blank",text:"Flickr",contentLink:null},{href:"https://www.instagram.com/eduskunta_riksdagen/?hl=fi",title:"Instagram",target:"_blank",text:"Instagram",contentLink:null},{href:"https://www.linkedin.com/company/12304/",title:"LinkedIn",target:"_blank",text:"LinkedIn",contentLink:null},{href:"https://twitter.com/SuomenEduskunta",title:"X",target:"_blank",text:"X",contentLink:null},{href:"https://www.youtube.com/user/SuomenEduskunta",title:"Youtube",target:"_blank",text:"Youtube",contentLink:null}],footerSiteLinks:[{href:"mailto:verkkosivut@eduskunta.fi",title:null,target:"_blank",text:"Give feedback about the site",contentLink:null}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/en/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Members of Parliament",teaserText:"The Finnish Parliament has two hundred Members of Parliament, who are elected in elections every four years. The Members of Parliament work in plenary sessions, in committees, and in parliamentary groups.",url:"/en/members-and-parliamentary-bodies/members-of-parliament/",selected:false,targetFrame:"_self",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Plenary sessions and committee work",teaserText:"A Member of Parliament is a legislator, a societal actor, a representative of their constituency and an international actor. Plenary sessions are the most visible part of an MP’s parliamentary work, but committees provide MPs with their most important channel for influencing decision-making.",url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/plenary-sessions-and-committee-work/",selected:false,targetFrame:"_self",contentLink:"1848"},{children:[],relatedContent:[],name:"MPs’ remunerations and fixed reimbursements of expenses",teaserText:"MPs do not receive a salary, instead, they are paid the Member of Parliament’s remuneration. The remuneration is taxable income. In addition to the remuneration, MPs receive a tax‑free fixed reimbursement of expenses to cover their costs. ",url:e,selected:false,targetFrame:"_self",contentLink:"10"},{children:[],relatedContent:[],name:"Private interests of MPs",teaserText:"A Member of Parliament must submit to Parliament a declaration of private interests, income that may affect the MP's ability to carry out responsibilities in Parliament and gifts received by the MP.",url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/private-interests-of-mps/",selected:false,targetFrame:"_self",contentLink:"12"},{children:[],relatedContent:[],name:"Replacement of an MP",teaserText:"An MP may be replaced during the electoral term if Parliament grants the Member a release from the office of Member of Parliament. An MP may also suspend the performance of parliamentary duties if they are elected as a Member of the European Parliament during the electoral term.\n\n",url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/replacement-of-a-member-of-parliament/",selected:false,targetFrame:"_self",contentLink:"1654"},{children:[],relatedContent:[],name:"MPs’ pensions and adjustment allowance",teaserText:"A Member of Parliament accrues pension entitlements. As a rule, an MP may receive a pension at the age of 65. An MP may also be entitled to a fixed-term adjustment allowance.",url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/mps-pensions-and-adjustment-allowance/",selected:false,targetFrame:"_self",contentLink:"11"}],relatedContent:[],name:"Information on the work of a Member of Parliament",teaserText:"Information on the work of a Member of Parliament",url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/",selected:false,targetFrame:"_self",contentLink:"13"},{children:[],relatedContent:[],name:"The Speaker",teaserText:d,url:"/en/members-and-parliamentary-bodies/the-speaker/",selected:false,targetFrame:"_self",contentLink:"15"},{children:[],relatedContent:[],name:"The Government and the Opposition",teaserText:"The Government and the Opposition are the key actors in the functioning of Parliament. ",url:"/en/members-and-parliamentary-bodies/the-government-and-the-opposition/",selected:false,targetFrame:"_self",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Social Affairs and Health Committee",teaserText:"The Social Affairs and Health Committee deals with matters concerning social welfare and health care, social security and environmental health care.​",url:"/en/members-and-parliamentary-bodies/committees/social-affairs-and-health-committee/",selected:false,targetFrame:"_self",contentLink:"2876"}],relatedContent:[],name:"Committees",teaserText:"Parliament’s decisions are prepared in committees. ​Parliament has 16 permanent special committees and the Grand Committee, which deals primarily with EU affairs.",url:"/en/members-and-parliamentary-bodies/committees/",selected:false,targetFrame:"_self",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"The work of parliamentary groups",teaserText:"The work of parliamentary groups",url:"/en/members-and-parliamentary-bodies/parliamentary-groups/the-work-of-parliamentary-groups/",selected:false,targetFrame:"_self",contentLink:"18"}],relatedContent:[],name:"Parliamentary groups",teaserText:"Members form parliamentary groups according to political party, and these play a key role in parliamentary work on a practical level. Each parliamentary group elects its own chairpersons and possibly other organs.",url:"/en/members-and-parliamentary-bodies/parliamentary-groups/",selected:false,targetFrame:"_self",contentLink:"17"},{children:[{children:[],relatedContent:[{children:[],relatedContent:[],name:"Delegations to interparliamentary organisations",teaserText:null,url:"/en/members-and-parliamentary-bodies/international-activities/delegations-to-interparliamentary-organisations/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Networks, friendship groups and cooperation groups",teaserText:null,url:"/en/members-and-parliamentary-bodies/networks_friendship_groups_and_cooperation_groups/",selected:false,targetFrame:null,contentLink:null}],name:"International activities of Parliament",teaserText:"Members of Parliament also represent Finland in international politics. They work within inter-parliamentary organisations, and there are bilateral exchange visits between parliaments. An important part of this cooperation also includes meetings and conferences of the Speakers as well as the activities of friendship groups.",url:"/en/members-and-parliamentary-bodies/international-activities/international-activities-of-the-parliament/",selected:false,targetFrame:"_self",contentLink:"21"},{children:[],relatedContent:[],name:"Delegations to interparliamentary organisations",teaserText:"Parliament regurarly participates in the activities of nine interparliamentary organisations. Delegations are appointed for the periods of an electoral term.",url:"/en/members-and-parliamentary-bodies/international-activities/delegations-to-interparliamentary-organisations/",selected:false,targetFrame:"_self",contentLink:"1241"}],relatedContent:[],name:"International activities",teaserText:a,url:"/en/members-and-parliamentary-bodies/international-activities/",selected:false,targetFrame:"_self",contentLink:"20"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Consideration of EU matters in Parliament",teaserText:null,url:"/en/matters-and-voting/eu-matters/consideration-of-eu-matters-in-parliament/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Parliaments role in EU decision-making",teaserText:null,url:"/en/matters-and-voting/eu-matters/parliaments-role-in-eu-decision-making/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Latest EU matters",teaserText:null,url:"/en/matters-and-voting/eu-matters/latest-eu-matters/",selected:false,targetFrame:null,contentLink:null}],name:"EU activity",teaserText:"Parliament participates in interparliamentary cooperation within the European Union as part of the interaction between the Member States and the European Parliament. The handling of EU affairs involves coordination, cooperation among Members of Parliament, and international contacts, which are carried out both through Parliament’s internal operations and via interparliamentary networks.",url:"/en/members-and-parliamentary-bodies/eu-activity/",selected:false,targetFrame:"_self",contentLink:"7746"},{children:[{children:[],relatedContent:[],name:"​​Parliamentary friendship groups",teaserText:"In addition to the official international activities of Parliament, international contacts are maintained by friendship groups established by MPs. The friendship groups listed below have been organized after the spring 2023 parliamentary elections. ​​The activities of the friendship groups are informal.​",url:"/en/members-and-parliamentary-bodies/networks_friendship_groups_and_cooperation_groups/parliamentary-friendship-groups/",selected:false,targetFrame:"_self",contentLink:"24"}],relatedContent:[],name:"Networks, friendship groups and cooperation groups",teaserText:"Members of Parliament participate in various societal networks, friendship groups, and clubs. These bring together MPs with shared interests and complement the debates held in Parliament.",url:"/en/members-and-parliamentary-bodies/networks_friendship_groups_and_cooperation_groups/",selected:false,targetFrame:"_self",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"MPs’ remunerations and fixed reimbursements of expenses",teaserText:null,url:e,selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Private interests of MPs",teaserText:null,url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/private-interests-of-mps/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Replacement of an MP",teaserText:null,url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/replacement-of-a-member-of-parliament/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"MPs’ pensions and adjustment allowance",teaserText:null,url:"/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/mps-pensions-and-adjustment-allowance/",selected:false,targetFrame:null,contentLink:null}],name:"MPs and parliamentary bodies",teaserText:"The Parliament of Finland has two hundred members, elected by citizens through general elections. Within Parliament, Members are organised into parliamentary groups, which are divided into government and opposition groups. Parliament also appoints Members to serve in institutions and bodies operating at both national and international levels.",url:"/en/members-and-parliamentary-bodies/",selected:false,targetFrame:"_self",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Pending matters",teaserText:"On this page, you can view the matters currently under consideration in Parliament. You can filter the matters by the functions of Parliament, by type of matter, or by the different stages of consideration. Note that parliamentary documents are only available in Finnish and Swedish.",url:"/en/matters-and-voting/pending-matters/",selected:false,targetFrame:"_self",contentLink:"1365"},{children:[{children:[],relatedContent:[],name:"Parliaments role in EU decision-making",teaserText:"The Parliament decides on how Finland positions itself on those matters to be decided in the EU that fall within its competence.",url:"/en/matters-and-voting/eu-matters/parliaments-role-in-eu-decision-making/",selected:false,targetFrame:"_self",contentLink:"1407"},{children:[],relatedContent:[],name:"Consideration of EU matters in Parliament",teaserText:"EU regulations, and in particular directives, often require amendments to Finland’s national legislation. Such matters are decided in Parliament through the ordinary legislative procedure. EU matters are dealt with in all committees, but the Grand Committee acts as Parliament’s main EU committee and adopts Parliament’s position on European Union matters.",url:"/en/matters-and-voting/eu-matters/consideration-of-eu-matters-in-parliament/",selected:false,targetFrame:"_self",contentLink:"1659"}],relatedContent:[],name:"EU matters",teaserText:"The Parliament of Finland plays a strong role in decision-making on EU matters, compared with many other member states. Parliament decides what position Finland should take in EU decision-making on matters that fall within Parliament's competence.",url:"/en/matters-and-voting/eu-matters/",selected:false,targetFrame:"_self",contentLink:"1658"},{children:[],relatedContent:[],name:"Latest votes",teaserText:"On this page, you can find the latest voting results from plenary sessions. In Parliament, votes are most commonly held during the consideration of legislative proposals and the state budget, as well as in elections of persons and bodies. Note that voting results are only available in Finnish and Swedish.",url:"/en/matters-and-voting/latest-votes/",selected:false,targetFrame:"_self",contentLink:"3435"},{children:[],relatedContent:[],name:"Voting in Parliament",teaserText:"In Parliament, votes are most commonly held in the consideration of bills and the State budget, as well as in elections of officials and parliamentary bodies. In a vote, the option with the most support among two or more alternatives is chosen. ",url:"/en/matters-and-voting/voting-in-parliament/",selected:false,targetFrame:"_self",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Open data",teaserText:null,url:"https://julkinen.beta.eduskunta.fi/en/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Enacting legislation",teaserText:null,url:"/en/parliament-and-its-activities/enacting-legislation/",selected:false,targetFrame:null,contentLink:null}],name:"Matters and voting",teaserText:"Parliament can enact legislation on the basis of a government proposal, a Member's motion or a citizens' initiative. Most legislation is based on government proposals, which average about 250 a year. ",url:"/en/matters-and-voting/",selected:false,targetFrame:"_self",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Information on plenary sessions of Parliament",teaserText:"Acts are enacted in a plenary session. Plenary sessions are held from Tuesday to Friday. On Tuesdays and Wednesdays, plenary sessions usually start at 2 p.m., on Thursdays at 4 p.m., and on Fridays at 1 p.m.",url:"/en/plenary-sessions-and-events/information-on-plenary-sessions-of-parliament/",selected:false,targetFrame:"_self",contentLink:"34"}],relatedContent:[{children:[],relatedContent:[],name:"See the plenary session schedule in the calendar",teaserText:null,url:"/en/plenary-sessions-and-events/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Go to the Webcasts and videos service",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/",selected:false,targetFrame:null,contentLink:null}],name:"​Plenary sessions and events",teaserText:"Parliament's most important task, enacting legislation, takes place in plenary session. Plenary sessions are open to the public, and you can also follow them online.",url:"/en/plenary-sessions-and-events/",selected:false,targetFrame:"_self",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Parliament decides on the budget",teaserText:"Approving the budget is the Parliament’s second core function alongside the enactment of laws. The annual budget sets out the central government income and expenditure for the following year. The Government submits a budget proposal to Parliament, and Parliament makes the final decision.",url:"/en/parliament-and-its-activities/parliament-at-work/parliament-decides-on-the-budget/",selected:false,targetFrame:"_self",contentLink:"37"}],relatedContent:[],name:"Parliament at work​",teaserText:b,url:"/en/parliament-and-its-activities/parliament-at-work/",selected:false,targetFrame:"_self",contentLink:"36"},{children:[],relatedContent:[],name:"Enacting legislation",teaserText:"New legislation is enacted or existing laws amended based on a government proposal, a legislative motion by an MP, or a citizens’ initiative. The legislative process in Parliament begins with a referral debate, after which the bill is referred to a committee for consideration. Once the committee has completed its report, the bill is debated in two readings in a plenary session. If Parliament approves the bill, it issues a formal response. Finally, the President of the Republic confirms the law.\n",url:"/en/parliament-and-its-activities/enacting-legislation/",selected:false,targetFrame:"_self",contentLink:"39"},{children:[],relatedContent:[],name:"Scheduling and planning of parliamentary work",teaserText:"Parliament’s term of office is the electoral term, i.e. four years. The term begins once the results of the parliamentary elections have been confirmed and continues until the next elections have been held.",url:"/en/parliament-and-its-activities/scheduling-and-planning-of-parliamentary-work/",selected:false,targetFrame:"_self",contentLink:"1337"},{children:[],relatedContent:[],name:"Brief history of Parliament",teaserText:"Over the course of its history, the Parliament of Finland has enacted laws under the shadow of imperial rule, revolution and world wars. Finnish representative democracy has withstood both internal and external pressures without breaking down—something rare in the violent history of 20th-century Europe.\n\n",url:"/en/parliament-and-its-activities/brief-history-of-parliament/",selected:false,targetFrame:"_self",contentLink:"1322"},{children:[],relatedContent:[],name:"The Parliament of Finland as an organisation",teaserText:"The Parliamentary Office supports parliamentary work and the work of Members of Parliament. Approximately 400 officials and about 40 assistants to Members of Parliament work in the Parliamentary Office.",url:"/en/parliament-and-its-activities/the-parliament-of-finland-as-an-organisation/",selected:false,targetFrame:"_self",contentLink:"42"},{children:[],relatedContent:[],name:"Parliamentary elections",teaserText:"In parliamentary elections, 200 Members of Parliament are elected to the Parliament of Finland. Parliamentary elections are held every four years. The next parliamentary elections will be in 2027.",url:"/en/parliament-and-its-activities/parliamentary-elections/",selected:false,targetFrame:"_self",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Brochures on the parliamentary work",teaserText:"The brochures provide information on, among other things, the work of Parliament, the history of Parliament and the early years of independence, Parliament’s role in the national preparation of the matters to be deliberated in the European Union, the Parliament Building and the Library of Parliament.",url:"/en/parliament-and-its-activities/learning-materials/brochures-on-the-parliamentary-work/",selected:false,targetFrame:"_self",contentLink:"47"},{children:[],relatedContent:[],name:"How laws are made in Finland",teaserText:"Parliament’s most important task is to enact legislation. Familiarise yourself with the stages of the legislative process.",url:"/en/parliament-and-its-activities/learning-materials/how-laws-are-made-in-finland/",selected:false,targetFrame:"_self",contentLink:"1774"}],relatedContent:[],name:"Learning materials",teaserText:"Parliament supports democracy education as well as the teaching of social studies and history by providing learning materials for schools.",url:"/en/parliament-and-its-activities/learning-materials/",selected:false,targetFrame:"_self",contentLink:"44"}],relatedContent:[{children:[],relatedContent:[],name:"Visit Parliament",teaserText:null,url:"/en/visit-and-participate/visit-parliament/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Go to the Finnish Parliamentary Glossary",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/fi-en/",selected:false,targetFrame:"_blank",contentLink:null}],name:"Parliament and its activities",teaserText:"Parliament enacts legislation and approves the state budget. It also elects the Prime Minister and oversees the Government. In addition, Parliament ratifies international treaties and influences European Union matters. ",url:"/en/parliament-and-its-activities/",selected:false,targetFrame:"_self",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"Independent visits",teaserText:"The Parliament Building can be explored independently either through a virtual tour or by coming on site to follow a plenary session from the public gallery. The events at Visitor Centre are also open to the public.",url:"/en/visit-and-participate/visit-parliament/independent-visits/",selected:false,targetFrame:"_self",contentLink:"52"},{children:[],relatedContent:[],name:"Visitor Centre",teaserText:"The centre, which is located in the Little Parliament, hosts events for the public. ",url:"/en/visit-and-participate/visit-parliament/visitor_centre/",selected:false,targetFrame:"_self",contentLink:"55"},{children:[],relatedContent:[],name:"Guidance for visitors",teaserText:"Please familiarise yourself with these instructions before visiting the Parliament Building. ",url:"/en/visit-and-participate/visit-parliament/guidance-for-visitors/",selected:false,targetFrame:"_self",contentLink:"56"}],relatedContent:[],name:"Visit Parliament",teaserText:c,url:"/en/visit-and-participate/visit-parliament/",selected:false,targetFrame:"_self",contentLink:"51"},{children:[],relatedContent:[],name:"Parliament Building",teaserText:"The plenary session of Parliament decided on the construction of the Parliament Building in March 1925. Construction of the building, designed by architect J. S. Sirén, began on Arkadianmäki in 1926, and the building was completed in 1931.",url:"/en/visit-and-participate/parliament-building/",selected:false,targetFrame:"_self",contentLink:"1276"},{children:[],relatedContent:[],name:"Follow webcasts",teaserText:"Watch a plenary session, a public committee hearing or another parliamentary event live online or as a recording.",url:"/en/visit-and-participate/follow-webcasts/",selected:false,targetFrame:"_self",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Make an impact by voting",teaserText:"In elections, we choose who makes the decisions. Through elections, we choose Parliament, the President, municipal and county decision-makers, and Finland’s representatives in the European Union. ",url:"/en/visit-and-participate/how-can-you-make-a-difference/make-an-impact-by-voting/",selected:false,targetFrame:"_self",contentLink:"65"},{children:[],relatedContent:[],name:"Influence legislation",teaserText:"Parliament decides on the laws of Finland. Citizens can also propose the creation of a new law or amendments to existing legislation. You can also contact Members of Parliament (MPs) and share your views on legislative proposals. ",url:"/en/visit-and-participate/how-can-you-make-a-difference/influence-legislation/",selected:false,targetFrame:"_self",contentLink:"67"},{children:[],relatedContent:[],name:"Many ways to make a difference",teaserText:"There are many ways to influence decisions. You can choose the way that best suits you. \n\nExamples include citizens’ initiatives, joining an organisation or a political party, engaging in discussions and taking part in different forms of expression. ",url:"/en/visit-and-participate/how-can-you-make-a-difference/many-ways-to-make-a-difference/",selected:false,targetFrame:"_self",contentLink:"66"}],relatedContent:[],name:"How can you make a difference?",teaserText:"Everyone has the right to participate in politics and to influence what kinds of decisions are made. You can vote in elections and influence who makes the decisions. You can engage in discussions and express your views when decision-makers are preparing new legislation. In addition, there are many other ways to participate and make an impact. ",url:"/en/visit-and-participate/how-can-you-make-a-difference/",selected:false,targetFrame:"_self",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Guidance for visitors",teaserText:null,url:"/en/visit-and-participate/visit-parliament/guidance-for-visitors/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"See the plenary schedule and other events",teaserText:null,url:"/en/plenary-sessions-and-events/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Library and archives",teaserText:null,url:"/en/library-and-archives/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Contact a Member of Parliament",teaserText:null,url:"/en/members-and-parliamentary-bodies/members-of-parliament/",selected:false,targetFrame:null,contentLink:null}],name:"Visit and participate",teaserText:"The Parliament Building is open to visitors. You can reserve a spot for a guided tour through the booking service. You can also follow the plenary sessions of Parliament, public hearings of committees, and other events organized by Parliament live online. Everyone can influence decision-making. You can discuss and share your opinions when new laws are being planned.",url:"/en/visit-and-participate/",selected:false,targetFrame:"_self",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Parliament of Finland",teaserText:null,url:"/en/",selected:true,targetFrame:"_self",contentLink:null}],languageMenuItems:[{name:"sv",url:"/sv/"},{name:"fi",url:"/fi/"}],alternateLanguages:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"},{name:"fi",url:"/fi/"}],headerFooter:{headerLinks:[{name:"Webcasts and videos",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/",selected:false,targetFrame:"_blank",contentLink:null},{name:"Library and archives",teaserText:null,url:"/en/library-and-archives/",selected:false,targetFrame:"_top",contentLink:null},{name:"Open data",teaserText:null,url:"/en/open-data/",selected:false,targetFrame:null,contentLink:null},{name:"For the media",teaserText:null,url:"/en/for-the-media/",selected:false,targetFrame:null,contentLink:null}],footerShortcutLinks:[{name:"Parliament at work​",teaserText:null,url:"/en/parliament-and-its-activities/parliament-at-work/",selected:false,targetFrame:null,contentLink:null},{name:"Visit Parliament",teaserText:null,url:"/en/visit-and-participate/visit-parliament/",selected:false,targetFrame:null,contentLink:null},{name:"The Speaker",teaserText:null,url:"/en/members-and-parliamentary-bodies/the-speaker/",selected:false,targetFrame:null,contentLink:null}],footerSocialMediaLinks:[{name:"Facebook",teaserText:null,url:"https://www.facebook.com/suomeneduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Flickr",teaserText:null,url:"https://www.flickr.com/photos/finnishparliament",selected:false,targetFrame:"_blank",contentLink:null},{name:"Instagram",teaserText:null,url:"https://www.instagram.com/eduskunta_riksdagen/?hl=fi",selected:false,targetFrame:"_blank",contentLink:null},{name:"LinkedIn",teaserText:null,url:"https://www.linkedin.com/company/12304/",selected:false,targetFrame:"_blank",contentLink:null},{name:"X",teaserText:null,url:"https://twitter.com/SuomenEduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Youtube",teaserText:null,url:"https://www.youtube.com/user/SuomenEduskunta",selected:false,targetFrame:"_blank",contentLink:null}],footerSiteLinks:[{name:"Give feedback about the site",teaserText:null,url:"mailto:verkkosivut@eduskunta.fi",selected:false,targetFrame:"_blank",contentLink:null}]},staticRoutes:{}},anchors:[],shortcutUrl:null,tags:null,teaserTitle:"",teaserText:"",teaserLinkText:"Read more",teaserImage:null}},uses:{params:["contentUrl"],url:1}}}("Parliament supports Finland’s foreign policy priorities in its international cooperation. These priorities include the promotion of human rights, the strengthening of democratic institutions, the maintenance of the international rules-based order, and the adherence to international law.","The Parliament’s most important task is to enact laws. It also decides on the state budget, elects the Prime Minister, and oversees the Government.  In addition, Parliament approves Finland’s international agreements and plays a role in European Union affairs.\n","​​There are many ways for you to explore the Parliament Building and learn about the activities of the Parliament. Come observe a plenary session or book a visit.","The Speaker of Parliament holds a central role in the functioning of Parliament. This position is also reflected in the informal national hierarchy, where the Speaker ranks immediately after the President of the Republic. The Speaker presides over plenary sessions and ensures their compliance with the Constitution.\n","/en/members-and-parliamentary-bodies/information-on-the-work-of-a-member-of-parliament/mps-remunerations-and-fixed-reimbursements-of-expenses/"))],
