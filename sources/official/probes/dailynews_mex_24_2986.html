  <script language="Javascript">
    window.addEventListener("load", function (event) {
      var x = new Date(document.lastModified);
      // document.getElementById("angularAppVersion").innerHTML += ' Last modified: ' + x;
      
      // Helper function to safely get element value
      function getElementValue(id) {
        var el = document.getElementById(id);
        return el !== null ? el.value : null;
      }
      
      // Helper function to safely parse JSON from element value
      function safeJsonParse(id) {
        try {
          var value = getElementValue(id);
          if (value !== null && value.length > 0) {
            return JSON.parse(value);
          }
        } catch (e) {
          // JSON parse failed, return null to maintain previous behavior
        }
        return null;
      }
      
      // Function to build and send piwik tracking
      function buildAndSendPiwik() {
        // piwik
        piwikObject = {
         section: 'presscorner',
         siteSection: 'commission presscorner',
        };

        if (document.getElementById("piwikType") !== null) {
          piwikObject.siteSection = piwikObject.siteSection + ' ' + document.getElementById("piwikType").value;
        }
        if (document.getElementById("piwikPAreaold") !== null) {
          piwikObject.siteSection = piwikObject.siteSection + ' ' + document.getElementById("piwikPAreaold").value;
        }
        if (document.getElementById("piwikEtranslated") !== null) {
          if(document.getElementById("piwikEtranslated").value === 'true') {
            piwikObject.siteSection = piwikObject.siteSection + ' etranslated';
          }
        }
      
        if (document.getElementById("piwikLng") !== null) {
          piwikObject.lang = document.getElementById("piwikLng").value;
        }
        if (document.getElementById("piwikSearchResult") !== null) {
          if (document.getElementById("piwikSearchResult").value.length) {
            piwikObject.search = document.getElementById("piwikSearchResult").value;
          }
        }

        // New piwik dimension
        arraydimension= [];
        piwikObject.dimensions= arraydimension;
        
        var pArea = safeJsonParse("piwikPArea");
        if (pArea !== null) {
          piwikObject.dimensions[0] = pArea;
        }
        
        var commissioner = safeJsonParse("piwikCommissionner");
        if (commissioner !== null) {
          piwikObject.dimensions[1] = commissioner;
        }
        
        var pubDate = safeJsonParse("piwikPubDate");
        if (pubDate !== null) {
          piwikObject.dimensions[2] = pubDate;
        }
        
        $wt.trackPageView(piwikObject);
      }
      
      // Wait minimum 4 seconds (preserve original timing for working cases)
      // Then poll for elements that may load later on slower connections
      setTimeout(function () {
        var maxAdditionalWait = 6000; // Max 6 more seconds of polling (10 sec total max)
        var pollInterval = 500;
        var waited = 0;
        
        // Check if key elements are ready (at least one dimension element should have a value)
        function areElementsReady() {
          var pArea = document.getElementById("piwikPArea");
          var pType = document.getElementById("piwikType");
          var pLng = document.getElementById("piwikLng");
          
          // If none of these elements exist, Angular content might not need them - proceed
          if (pArea === null && pType === null && pLng === null) {
            return true;
          }
          
          // If piwikPArea exists, check it has a non-empty value (key indicator)
